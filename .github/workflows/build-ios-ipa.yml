name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: "1"
      OPENCODE2_MOBILE_DISABLE_LOCAL_DEPLOYMENT: "1"
      OPENCODE2_MOBILE_APP_NAME: "OpenCode"
      OPENCODE2_MOBILE_ALLOW_DEVELOPMENT_HTTP: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Show toolchain
        run: |
          node -v
          pnpm -v
          xcodebuild -version
          pod --version

      - run: pnpm install --frozen-lockfile

      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods install
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Detect workspace and scheme
        id: xc
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          PROJ=$(ls -d *.xcodeproj | head -1)
          APPNAME=$(basename "$PROJ" .xcodeproj)
          echo "project=$PROJ app=$APPNAME"
          echo "=== workspace schemes:"
          xcodebuild -workspace "$WS" -list
          SCHEME="$APPNAME"
          AVAILABLE=$(xcodebuild -workspace "$WS" -list | sed -n '/Schemes:/,$p' | tail -n +2 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$')
          echo "=== available schemes"; echo "$AVAILABLE"
          if ! echo "$AVAILABLE" | grep -Fxq "$SCHEME"; then
            SCHEME=$(echo "$AVAILABLE" | grep -Fx "$APPNAME" | head -1)
          fi
          test -n "$SCHEME"
          echo "=== selected scheme: [$SCHEME]"
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "WS=$WS SCHEME=$SCHEME"

      - name: Build (unsigned Release)
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/dd" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      - name: Locate and package IPA
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          echo "=== build settings"
          BPD=$(xcodebuild -workspace "${{ steps.xc.outputs.workspace }}" -scheme "${{ steps.xc.outputs.scheme }}" -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{print $2; exit}')
          NAME=$(xcodebuild -workspace "${{ steps.xc.outputs.workspace }}" -scheme "${{ steps.xc.outputs.scheme }}" -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null | awk -F' = ' '/ FULL_PRODUCT_NAME /{print $2; exit}')
          echo "BUILT_PRODUCTS_DIR=$BPD"
          echo "FULL_PRODUCT_NAME=$NAME"

          CANDIDATES=""
          [ -n "$BPD" ] && [ -n "$NAME" ] && [ -d "$BPD/$NAME" ] && CANDIDATES="$BPD/$NAME"
          if [ -z "$CANDIDATES" ]; then
            echo "=== fallback search"
            CANDIDATES=$(find "$GITHUB_WORKSPACE" "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d -name '*.app' -not -path '*/Pods/*' -not -path '*Tests*' 2>/dev/null | head -5)
            echo "$CANDIDATES"
          fi
          APP=$(echo "$CANDIDATES" | head -1)
          echo "APP=$APP"
          test -n "$APP" && test -d "$APP"

          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../OpenCode-unsigned.ipa Payload
          cd ..
          ls -lh OpenCode-unsigned.ipa
          unzip -l OpenCode-unsigned.ipa | head -6

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCode-unsigned-ipa
          path: apps/mobile/ios/OpenCode-unsigned.ipa
          if-no-files-found: error
